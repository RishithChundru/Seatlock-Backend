# Scrapes the API running on your machine (outside Docker). The password must match METRICS_TOKEN in .env.
# To scrape production instead: target <your-api>.onrender.com, scheme https, and your real METRICS_TOKEN.
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: seatlock-api
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password: local-dev-metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
