# Fixed project name so containers/volumes don't change if the folder is renamed
name: seatlock

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest)

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP the app sends to
      - "8025:8025" # inbox UI: http://localhost:8025

  # --- Optional: S3-compatible storage for event covers (local stand-in for Cloudflare R2) ---
  # docker compose --profile storage up -d, then uncomment the S3_* lines in .env.example's storage section.
  # S3Mock accepts any credentials and serves objects publicly, like an R2 public bucket.
  s3:
    profiles: [storage]
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: seatlock-images
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9000:9090" # S3 API + public image URLs at http://localhost:9000/seatlock-images/...

  # --- Optional: metrics dashboards ---
  # docker compose --profile observability up -d, set METRICS_TOKEN=local-dev-metrics in .env,
  # then open Grafana at http://localhost:3001 (dashboard "Seatlock")
  prometheus:
    profiles: [observability]
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
  grafana:
    profiles: [observability]
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/seatlock.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"

volumes:
  pgdata:
