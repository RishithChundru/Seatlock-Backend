spring.application.name=seatlock
# Local dev: values can come from a .env file in the working directory (see .env.example). Real env vars win.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seatlock}
spring.datasource.username=${DB_USER:seatlock}
spring.datasource.password=${DB_PASSWORD:seatlock}
# Hot reads are served from Redis, so the pool only backs writes and cache misses.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# Fail fast under overload: 503 + Retry-After after 5 s instead of hanging requests for Hikari's default 30 s
spring.datasource.hikari.connection-timeout=5000
# Schema = Flyway migrations in src/main/resources/db/migration. Hibernate only checks the entities match.
spring.jpa.hibernate.ddl-auto=validate
# Databases created before migrations existed already have the V1 schema: mark them as V1 instead of failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# rediss:// (two s) turns on TLS, which hosted Redis such as Upstash requires
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=60s
# Bump when a cached DTO changes shape, so a new deploy never deserializes the old format
spring.cache.redis.key-prefix=v2::

# amqps:// turns on TLS, which hosted RabbitMQ such as CloudAMQP uses
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
# 3 attempts with backoff, then the message is rejected and dead-lettered to booking.confirmed.dlq
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Email over SMTP. Locally: Mailpit from docker-compose (inbox at http://localhost:8025).
# Production example (Resend): SMTP_HOST=smtp.resend.com SMTP_PORT=587 SMTP_USER=resend SMTP_PASSWORD=<api key> SMTP_AUTH=true SMTP_STARTTLS=true
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${MAIL_FROM:Seatlock <tickets@seatlock.local>}
# Links in emails point here
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Mail is best-effort; an SMTP outage must not mark the whole app unhealthy (Render would restart it)
management.health.mail.enabled=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-it-must-be-32-bytes+}
# Short-lived access token (Authorization header, kept in memory by the frontend) + long-lived refresh
# token in an httpOnly cookie, rotated on every use.
app.auth.access-ttl=${ACCESS_TOKEN_TTL:1h}
app.auth.refresh-ttl=${REFRESH_TOKEN_TTL:7d}
# true in production (HTTPS). The cookie is SameSite=Lax because the frontend proxies /api on its own domain.
app.auth.cookie-secure=${COOKIE_SECURE:false}
# Comma-separated, e.g. https://seatlock.vercel.app,http://localhost:3000
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
# Admin account created on first start (empty database). No default password: if ADMIN_PASSWORD is
# unset, a random one is generated and printed once in the startup log.
app.seed.admin-email=${ADMIN_EMAIL:admin@seatlock.local}
app.seed.admin-password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,prometheus
# /actuator/prometheus needs "Authorization: Bearer <METRICS_TOKEN>". Empty = metrics endpoint closed.
app.metrics.token=${METRICS_TOKEN:}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=seatlock

# OpenAPI JSON at /v3/api-docs, Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.paths-to-match=/api/**

# Event cover storage. Leave S3_BUCKET empty to keep covers in Postgres (default).
# Cloudflare R2: S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com S3_REGION=auto
#   S3_PUBLIC_URL=https://pub-<hash>.r2.dev (or your CDN domain). Locally: MinIO from docker-compose.
app.images.s3.bucket=${S3_BUCKET:}
app.images.s3.endpoint=${S3_ENDPOINT:}
app.images.s3.region=${S3_REGION:auto}
app.images.s3.access-key=${S3_ACCESS_KEY:}
app.images.s3.secret-key=${S3_SECRET_KEY:}
app.images.s3.public-url=${S3_PUBLIC_URL:}
