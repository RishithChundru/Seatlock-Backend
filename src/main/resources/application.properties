spring.application.name=seatlock

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seatlock}
spring.datasource.username=${DB_USER:seatlock}
spring.datasource.password=${DB_PASSWORD:seatlock}
# shortcut: Hibernate manages the schema, switch to Flyway migrations before a real deploy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=60s

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
# 3 attempts with backoff, then the message is rejected and dead-lettered to booking.confirmed.dlq
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-it-must-be-32-bytes+}
app.cors.origin=${CORS_ORIGIN:http://localhost:3000}

management.endpoints.web.exposure.include=health
