spring.application.name=seatlock
# Local dev: values can come from a .env file in the working directory (see .env.example). Real env vars win.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seatlock}
spring.datasource.username=${DB_USER:seatlock}
spring.datasource.password=${DB_PASSWORD:seatlock}
# Hot reads are served from Redis, so the pool only backs writes and cache misses.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# Fail fast under overload: 503 + Retry-After after 5 s instead of hanging requests for Hikari's default 30 s
spring.datasource.hikari.connection-timeout=5000
# shortcut: Hibernate manages the schema, switch to Flyway migrations before real users depend on the data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# rediss:// (two s) turns on TLS, which hosted Redis such as Upstash requires
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=60s

# amqps:// turns on TLS, which hosted RabbitMQ such as CloudAMQP uses
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
# 3 attempts with backoff, then the message is rejected and dead-lettered to booking.confirmed.dlq
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-it-must-be-32-bytes+}
# Comma-separated, e.g. https://seatlock.vercel.app,http://localhost:3000
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
# Admin account created on first start (empty database). No default password: if ADMIN_PASSWORD is
# unset, a random one is generated and printed once in the startup log.
app.seed.admin-email=${ADMIN_EMAIL:admin@seatlock.local}
app.seed.admin-password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health
