# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Values marked sync: false are prompted for once and stored as secrets in Render, never in git.
services:
  - type: web
    name: seatlock-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    # CI deploys via the deploy hook only after tests pass (.github/workflows/ci.yml)
    autoDeploy: false
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Links in emails (your Vercel URL)
      - key: FRONTEND_URL
        sync: false
      # Email over SMTP (e.g. Resend: smtp.resend.com / 587 / user "resend" / API key). Optional:
      # without these, emails fail quietly and are only logged; bookings and tickets still work.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
      - key: MAIL_FROM
        sync: false
